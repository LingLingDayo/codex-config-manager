name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

# 赋予工作流发布 Release 和写入仓库内容的权限
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows EXE & Draft Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Extract Changelog for Release
        id: extract_changelog
        run: node scripts/extract-changelog.js CHANGELOG.md RELEASE_NOTES.md ${{ github.ref_name }}

      - name: Build Tauri Application
        run: npm run tauri build
        env:
          CI: true

      - name: Create Draft Release & Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Codex Config Manager ${{ github.ref_name }}'
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/codex-config-manager.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
